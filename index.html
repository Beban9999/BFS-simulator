<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive breadth-first and depth-first search visualizer on a 20×20 grid.">
    <link rel="stylesheet" href="styles.css">
    <title>BFS / DFS Simulator</title>
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <h1>BFS / DFS Simulator</h1>
            <p class="subtitle">Visualize how breadth-first and depth-first search explore a grid.</p>
        </div>
    </header>

    <main class="layout">
        <section class="panel board">
            <div id="maze">
                <!-- Maze grid will be generated here -->
            </div>
            <p class="hint">Click cells to add or remove walls. Coordinates are 0–19 (row, column).</p>
        </section>

        <aside class="sidebar">
            <section id="control" class="panel">
                <h2>Controls</h2>

                <div class="field-group">
                    <span class="field-label"><span class="dot dot-start"></span>Start</span>
                    <div class="coords">
                        <label>Row
                            <input onchange="paintEverything()" type="number" id="startI" min="0" max="19" value="0">
                        </label>
                        <label>Col
                            <input onchange="paintEverything()" type="number" id="startJ" min="0" max="19" value="0">
                        </label>
                    </div>
                </div>

                <div class="field-group">
                    <span class="field-label"><span class="dot dot-end"></span>End</span>
                    <div class="coords">
                        <label>Row
                            <input onchange="paintEverything()" type="number" id="endI" min="0" max="19" value="15">
                        </label>
                        <label>Col
                            <input onchange="paintEverything()" type="number" id="endJ" min="0" max="19" value="15">
                        </label>
                    </div>
                </div>

                <div class="algo-row">
                    <span class="field-label">Algorithm</span>
                    <span id="algoName" class="badge">BFS</span>
                </div>

                <div class="actions">
                    <button id="start" class="btn btn-primary" onclick="startAlgo()">Begin</button>
                    <button id="reset" class="btn btn-secondary" onclick="reset()">Reset</button>
                </div>
                <button id="toggleAlgo" class="btn btn-ghost btn-block" onclick="toggleAlgorithm()">Switch to DFS</button>

                <div id="alert" role="alert"></div>
            </section>

            <section id="info" class="panel">
                <h2>Legend</h2>
                <ul class="legend">
                    <li><span class="swatch" style="background: var(--start);"></span>Start</li>
                    <li><span class="swatch" style="background: var(--end);"></span>End</li>
                    <li><span class="swatch" style="background: var(--obstacle);"></span>Wall</li>
                    <li><span class="swatch" style="background: var(--visited);"></span>Visited</li>
                    <li><span class="swatch" style="background: var(--path);"></span>Path</li>
                </ul>
            </section>
        </aside>
    </main>

    <script src="script.js"></script>
</body>

</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Steplore: step-by-step visualizations of the algorithms, data structures and patterns used in coding interviews, with live code and explanations." />
    <meta name="theme-color" content="#0e1116" />
    <title>Steplore — Watch algorithms run, step by step</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the page paints to avoid a flash of the wrong colours.
      try {
        var saved = JSON.parse(localStorage.getItem("steplore-prefs") || "null");
        var theme = (saved && saved.state && saved.state.theme) || localStorage.getItem("theme");
        if (theme === "light") document.documentElement.dataset.theme = "light";
      } catch (e) { /* storage unavailable: keep the dark default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
